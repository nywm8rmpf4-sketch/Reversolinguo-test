name: R4 UI spacing impact QA

on:
  push:
    branches:
      - impact/r4-ui-spacing

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVERSOLINGUO_BASE: /Reversolinguo-test/
    steps:
      - name: Checkout exact spacing candidate
        uses: actions/checkout@v4

      - name: Use baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Use baseline npm
        run: npm install --global npm@11.9.0

      - name: Verify exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = "a22b8ebe265ee44c392967a615c949039a2890ad"

      - name: Install exact dependencies
        run: npm ci

      - name: Lint affected E2E oracle
        run: npx eslint tests/e2e/accessibility.spec.mjs --max-warnings 0

      - name: Build exact Pages candidate once
        run: npm run build

      - name: Verify Pages size and scope
        shell: bash
        run: |
          set -euo pipefail
          dist_bytes="$(find dist -type f -printf '%s\n' | awk '{sum += $1} END {print sum+0}')"
          echo "dist uncompressed bytes: $dist_bytes"
          test "$dist_bytes" -le 3145728
          grep -Fq 'src="/Reversolinguo-test/assets/' dist/index.html
          grep -Fq 'href="/Reversolinguo-test/manifest.webmanifest"' dist/index.html
          grep -Fq '"scope":"/Reversolinguo-test/"' dist/manifest.webmanifest

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install pinned accessibility audit tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts @axe-core/playwright@4.13.0 axe-core@4.13.0
          test "$(node -p "require('./node_modules/@axe-core/playwright/package.json').version")" = "4.13.0"
          test "$(node -p "require('./node_modules/axe-core/package.json').version")" = "4.13.0"
          test "$(git hash-object package-lock.json)" = "a22b8ebe265ee44c392967a615c949039a2890ad"
          axe_path="$(node -p "require.resolve('axe-core/axe.min.js')")"
          echo "c24f097bd2f451d4f933e8bc7d8d539f8672a2ebcb5cc9f9f3eec8ca9470a0c1  $axe_path" | sha256sum --check --strict

      - name: Run only affected UI/accessibility path
        run: npx playwright test tests/e2e/accessibility.spec.mjs

      - name: Record exact artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256
          cat dist.sha256

      - name: Upload exact tested spacing artifact
        uses: actions/upload-artifact@v4
        with:
          name: r4-spacing-tested-dist-${{ github.sha }}
          path: |
            dist/
            dist.sha256
          if-no-files-found: error
