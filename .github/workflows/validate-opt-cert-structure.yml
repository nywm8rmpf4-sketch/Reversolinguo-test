name: Validate OPT-CERT workflow structure

on:
  push:
    branches:
      - process/opt-cert-1-r1

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout WIP workflow definitions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Parse workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; ARGV.each { |f| YAML.parse_file(f); puts \"parsed: #{f}\" }" \
            .github/workflows/promote-qualified.yml \
            .github/workflows/publish-certified.yml \
            .github/workflows/validate-opt-cert.yml

      - name: Enforce reduced manual input contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          def load(path):
              return yaml.load(Path(path).read_text(), Loader=yaml.BaseLoader)

          promote = load('.github/workflows/promote-qualified.yml')
          publish = load('.github/workflows/publish-certified.yml')

          promote_inputs = promote['on']['workflow_dispatch']['inputs']
          publish_inputs = publish['on']['workflow_dispatch']['inputs']
          assert set(promote_inputs) == {'artifact_id'}, promote_inputs
          assert set(publish_inputs) == {'artifact_id', 'release_tag'}, publish_inputs

          promote_text = Path('.github/workflows/promote-qualified.yml').read_text()
          publish_text = Path('.github/workflows/publish-certified.yml').read_text()
          assert 'workflow_run.head_sha' in promote_text and '.digest' in promote_text
          assert 'workflow_run.head_sha' in publish_text and '.digest' in publish_text

          publish_env = publish['jobs']['publish']['env']
          assert publish_env.get('PUBLICATION_TOKEN')
          assert publish_env.get('GH_TOKEN')
          assert 'REVERSOLINGUO_PUBLICATION_TOKEN' in publish_env['PUBLICATION_TOKEN']
          assert 'REVERSOLINGUO_PUBLICATION_TOKEN' in publish_env['GH_TOKEN']
          print('manual input and credential contracts: PASS')
          PY

      - name: Shell syntax check embedded scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml, subprocess
          for f in ['.github/workflows/promote-qualified.yml', '.github/workflows/publish-certified.yml']:
              doc = yaml.safe_load(Path(f).read_text())
              for job_name, job in doc.get('jobs', {}).items():
                  for i, step in enumerate(job.get('steps', []), 1):
                      script = step.get('run')
                      if not script:
                          continue
                      p = subprocess.run(['bash', '-n'], input=script, text=True, capture_output=True)
                      if p.returncode:
                          raise SystemExit(f'{f} {job_name} step {i} shell syntax FAIL: {p.stderr}')
          print('embedded bash syntax: PASS')
          PY
