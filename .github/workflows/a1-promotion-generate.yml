name: A1 promotion assembly diagnostic

on:
  push:
    branches:
      - 'assembly/a1-canonical-runtime-r1'
    paths:
      - '.github/workflows/a1-promotion-generate.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact assembly
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify approved staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3076a602351ce9bc21b600f8119ae5b704f77f10 HEAD
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Diagnose classified source-map reconciliation against current canonical catalog
        run: node tools/diagnose-a1-promotion.mjs
