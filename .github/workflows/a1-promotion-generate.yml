name: A1 promotion assembly generator

on:
  push:
    branches:
      - 'assembly/a1-canonical-runtime-r1'
    paths:
      - '.github/workflows/a1-promotion-generate.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact assembly
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved staging ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3076a602351ce9bc21b600f8119ae5b704f77f10 HEAD
          test -f tools/promote-a1-macro.mjs

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Generate exact canonical A1 payload and ephemeral signature
        run: node tools/promote-a1-macro.mjs

      - name: Verify generated files are limited to promotion outputs
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            catalogs/fr-es/a1/catalog.json \
            catalogs/fr-es/a1/manifest.json \
            catalogs/fr-es/a1/manifest.sig.json \
            evidence/active/A1_CANONICAL_PROMOTION_GENERATION_REPORT.json \
            src/content/catalogSigningKey.ts | sort)"
          test "$changed" = "$expected"

      - name: Commit generated promotion outputs to assembly only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogs/fr-es/a1/catalog.json catalogs/fr-es/a1/manifest.json catalogs/fr-es/a1/manifest.sig.json src/content/catalogSigningKey.ts evidence/active/A1_CANONICAL_PROMOTION_GENERATION_REPORT.json
          git commit -m 'data: materialize reviewed A1 macro catalog'
          git push origin HEAD:assembly/a1-canonical-runtime-r1
