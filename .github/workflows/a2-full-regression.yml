name: A2 full regression
# rerun: whitespace-normalizer-r4

on:
  push:
    branches:
      - assembly/a2-runtime-r1
    paths:
      - .github/workflows/a2-full-regression.yml

permissions:
  contents: read

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assembly/a2-runtime-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Replay deterministic A2 generation
        run: |
          node tools/promote-a2-level.mjs
          git diff --exit-code --             catalogs/fr-es/a2/catalog.json             catalogs/fr-es/a2/runtime-projection.json             catalogs/fr-es/a2/manifest.json             catalogs/fr-es/a2/projection-source.json             evidence/active/A2_RUNTIME_GENERATION_REPORT.json
      - name: Full static unit integration and build regression
        run: npm run check
