name: A2 targeted browser regression

on:
  push:
    branches:
      - assembly/a2-runtime-r1
    paths:
      - .github/workflows/a2-targeted-browser.yml

permissions:
  contents: read

jobs:
  targeted-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assembly/a2-runtime-r1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npx playwright test tests/e2e/path-selection.spec.ts
