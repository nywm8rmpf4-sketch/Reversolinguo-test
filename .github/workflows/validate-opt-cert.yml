name: Validate OPT-CERT exact replay

on:
  push:
    branches:
      - process/opt-cert-1-r1
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: reversolinguo-opt-cert-validation
  cancel-in-progress: false

jobs:
  replay-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '10327071495'
      EXPECTED_CANDIDATE_SHA: 0804ce7d69311db6d30acebdc9aace519ff7956d
      EXPECTED_ARTIFACT_SHA256: c1724a67c9ca7bc830b256078c8d51febc8a3badf60d0b14026a4262ec3595c4
      EXPECTED_TREE: f4db0209273ec571dc61334c70e255afad250e62
      SANDBOX_BRANCH: validation/opt-cert-1-v1.0.0
      PUBLICATION_REPO: nywm8rmpf4-sketch/Reversolinguo
      EXPECTED_PUBLICATION_MAIN: f7e627904d11b8ad6a3d341313ba460e6baaa160
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Snapshot protected refs before replay
        id: before
        shell: bash
        run: |
          set -euo pipefail
          test_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          gh_pages="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/gh-pages" --jq '.object.sha')"
          publication_main="$(gh api "repos/$PUBLICATION_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$publication_main" = "$EXPECTED_PUBLICATION_MAIN"
          echo "test_main=$test_main" >> "$GITHUB_OUTPUT"
          echo "gh_pages=$gh_pages" >> "$GITHUB_OUTPUT"
          echo "publication_main=$publication_main" >> "$GITHUB_OUTPUT"
          echo "test main before: $test_main"
          echo "gh-pages before: $gh_pages"
          echo "publication main before: $publication_main"

      - name: Resolve v1 identity from artifact metadata
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          candidate_sha="$(jq -r '.workflow_run.head_sha // empty' <<<"$metadata")"
          source_run_id="$(jq -r '.workflow_run.id // empty' <<<"$metadata")"
          digest="$(jq -r '.digest // empty' <<<"$metadata")"
          expired="$(jq -r '.expired' <<<"$metadata")"
          test "$expired" = "false"
          test "$candidate_sha" = "$EXPECTED_CANDIDATE_SHA"
          test "$source_run_id" = '34786852060'
          test "$digest" = "sha256:$EXPECTED_ARTIFACT_SHA256"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Download and verify v1 certified artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/certified-v1.zip"
          artifact_dir="$RUNNER_TEMP/certified-v1"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$artifact_zip"
          actual="$(sha256sum "$artifact_zip" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_ARTIFACT_SHA256"
          mkdir -p "$artifact_dir"
          unzip -q "$artifact_zip" -d "$artifact_dir"
          cd "$artifact_dir"
          test -d dist
          test -f dist.sha256
          sha256sum --check --strict dist.sha256
          if grep -R -Fq '/Reversolinguo-test/' dist; then
            echo 'ERROR: QA repository path leaked into certified artifact' >&2
            exit 1
          fi

      - name: Rebuild only the Git tree from exact bytes, never the application
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/certified-v1"
          replay_dir="$RUNNER_TEMP/opt-cert-replay"
          mkdir -p "$replay_dir"
          cd "$replay_dir"
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -a "$artifact_dir/dist"/. .
          cp "$artifact_dir/dist.sha256" ./dist.sha256
          touch .nojekyll
          git add -A
          replay_tree="$(git write-tree)"
          echo "replay tree: $replay_tree"
          test "$replay_tree" = "$EXPECTED_TREE"
          echo "replay_tree=$replay_tree" >> "$GITHUB_OUTPUT"
          gh auth setup-git
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"

      - name: Create or reuse sandbox replay idempotently
        id: sandbox
        shell: bash
        run: |
          set -euo pipefail
          replay_dir="$RUNNER_TEMP/opt-cert-replay"
          cd "$replay_dir"
          existing="$(git ls-remote origin "refs/heads/$SANDBOX_BRANCH" | awk '{print $1}')"
          if [ -n "$existing" ]; then
            git fetch --quiet origin "refs/heads/$SANDBOX_BRANCH:refs/remotes/origin/sandbox"
            existing_tree="$(git rev-parse refs/remotes/origin/sandbox^{tree})"
          else
            existing_tree=''
          fi
          if [ "$existing_tree" = "$EXPECTED_TREE" ]; then
            sandbox_commit="$existing"
            echo 'sandbox already contains the exact replay tree; idempotent no-op'
          else
            git commit -q -m "validation: OPT-CERT v1.0.0 exact replay"
            sandbox_commit="$(git rev-parse HEAD)"
            git push --force origin "HEAD:refs/heads/$SANDBOX_BRANCH"
          fi
          echo "sandbox_commit=$sandbox_commit" >> "$GITHUB_OUTPUT"

      - name: Verify sandbox remote tree and every artifact file hash
        shell: bash
        env:
          SANDBOX_COMMIT: ${{ steps.sandbox.outputs.sandbox_commit }}
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/opt-cert-replay-verify"
          git clone --quiet --depth=1 --branch "$SANDBOX_BRANCH" "https://github.com/$GITHUB_REPOSITORY.git" "$verify_dir"
          cd "$verify_dir"
          test "$(git rev-parse HEAD)" = "$SANDBOX_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          while read -r expected path; do
            rel="${path#dist/}"
            test -f "$rel"
            actual="$(sha256sum "$rel" | awk '{print $1}')"
            test "$actual" = "$expected"
          done < dist.sha256
          test -f .nojekyll

      - name: Prove protected refs were untouched
        shell: bash
        env:
          TEST_MAIN_BEFORE: ${{ steps.before.outputs.test_main }}
          GH_PAGES_BEFORE: ${{ steps.before.outputs.gh_pages }}
          PUBLICATION_MAIN_BEFORE: ${{ steps.before.outputs.publication_main }}
        run: |
          set -euo pipefail
          test_main_after="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          gh_pages_after="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/gh-pages" --jq '.object.sha')"
          publication_main_after="$(gh api "repos/$PUBLICATION_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$test_main_after" = "$TEST_MAIN_BEFORE"
          test "$gh_pages_after" = "$GH_PAGES_BEFORE"
          test "$publication_main_after" = "$PUBLICATION_MAIN_BEFORE"
          test "$publication_main_after" = "$EXPECTED_PUBLICATION_MAIN"

      - name: Validation summary
        shell: bash
        env:
          SANDBOX_COMMIT: ${{ steps.sandbox.outputs.sandbox_commit }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        run: |
          {
            echo '## OPT-CERT-1 replay validation'
            echo '- result: PASS if this job is green'
            echo "- artifact_id: $ARTIFACT_ID"
            echo "- artifact_digest: $ARTIFACT_DIGEST"
            echo "- candidate_sha: $EXPECTED_CANDIDATE_SHA"
            echo "- replay_tree: $EXPECTED_TREE"
            echo "- sandbox_branch: $SANDBOX_BRANCH"
            echo "- sandbox_commit: $SANDBOX_COMMIT"
            echo '- application rebuild: NO'
            echo '- Reversolinguo-test/main changed: NO'
            echo '- Reversolinguo-test/gh-pages changed: NO'
            echo '- Reversolinguo/main changed: NO'
          } >> "$GITHUB_STEP_SUMMARY"
