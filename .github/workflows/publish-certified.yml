name: Publish certified artifact

on:
  create:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Exact PASS QA artifact ID
        required: true
        type: string
      release_tag:
        description: Immutable release tag to create, for example v1.1.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: reversolinguo-certified-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'certify/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QA_TOKEN: ${{ github.token }}
      PUBLICATION_TOKEN: ${{ secrets.REVERSOLINGUO_PUBLICATION_TOKEN }}
      PUBLICATION_REPO: nywm8rmpf4-sketch/Reversolinguo
    steps:
      - name: Resolve certification request
        id: request
        shell: bash
        env:
          MANUAL_ARTIFACT_ID: ${{ inputs.artifact_id || '' }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag || '' }}
          CREATED_REF: ${{ github.event.ref || '' }}
          CREATED_REF_TYPE: ${{ github.event.ref_type || '' }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = 'create' ]; then
            test "$CREATED_REF_TYPE" = 'branch'
            case "$CREATED_REF" in
              certify/v*) ;;
              *) echo "ERROR: automatic certification requires certify/v* branch" >&2; exit 1 ;;
            esac
            release_tag="${CREATED_REF#certify/}"
            [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]

            candidate_sha="$(GH_TOKEN="$QA_TOKEN" gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CREATED_REF" --jq '.object.sha')"
            test_main="$(GH_TOKEN="$QA_TOKEN" gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            test -n "$candidate_sha"
            if [ "$candidate_sha" != "$test_main" ]; then
              echo "ERROR: certification ref $CREATED_REF does not point to qualified test/main" >&2
              echo "certification ref: $candidate_sha" >&2
              echo "test main:         $test_main" >&2
              exit 1
            fi

            expected_name="reversolinguo-tested-dist-$candidate_sha"
            artifacts="$(GH_TOKEN="$QA_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$expected_name&per_page=100")"
            matches="$(jq --arg expected "$expected_name" --arg candidate "$candidate_sha" '[.artifacts[] | select(.name == $expected and .expired == false and .workflow_run.head_sha == $candidate)] | sort_by(.created_at) | reverse' <<<"$artifacts")"
            match_count="$(jq 'length' <<<"$matches")"
            if [ "$match_count" -lt 1 ]; then
              echo "ERROR: no non-expired QA artifact found for $candidate_sha" >&2
              exit 1
            fi
            artifact_id="$(jq -r '.[0].id' <<<"$matches")"
            trigger_mode='automatic-certify-ref'
            certify_ref="$CREATED_REF"
          elif [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            artifact_id="$MANUAL_ARTIFACT_ID"
            release_tag="$MANUAL_RELEASE_TAG"
            test -n "$artifact_id"
            test -n "$release_tag"
            [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
            candidate_sha=''
            certify_ref=''
            trigger_mode='manual-dispatch'
          else
            echo "ERROR: unsupported trigger $GITHUB_EVENT_NAME" >&2
            exit 1
          fi

          echo "ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "CERTIFY_REF=$certify_ref" >> "$GITHUB_ENV"
          echo "REQUESTED_CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "requested_candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "certify_ref=$certify_ref" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=$trigger_mode" >> "$GITHUB_OUTPUT"
          echo "certification trigger: $trigger_mode"
          echo "release tag: $release_tag"
          echo "artifact id: $artifact_id"
          if [ -n "$candidate_sha" ]; then echo "requested candidate: $candidate_sha"; fi

      - name: Validate release label and credential
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          if [ -z "${PUBLICATION_TOKEN:-}" ]; then
            echo 'ERROR: dedicated publication credential is not configured.' >&2
            echo 'Expected secret: REVERSOLINGUO_PUBLICATION_TOKEN' >&2
            exit 1
          fi
          echo "RELEASE_BRANCH=release/${RELEASE_TAG}-certified" >> "$GITHUB_ENV"

      - name: Resolve certified candidate identity from artifact metadata
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(GH_TOKEN="$QA_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          expired="$(jq -r '.expired' <<<"$metadata")"
          candidate_sha="$(jq -r '.workflow_run.head_sha // empty' <<<"$metadata")"
          source_run_id="$(jq -r '.workflow_run.id // empty' <<<"$metadata")"
          digest="$(jq -r '.digest // empty' <<<"$metadata")"
          artifact_name="$(jq -r '.name // empty' <<<"$metadata")"
          test "$expired" = "false"
          test -n "$candidate_sha"
          test -n "$source_run_id"
          test -n "$artifact_name"

          if [ -n "${REQUESTED_CANDIDATE_SHA:-}" ] && [ "$candidate_sha" != "$REQUESTED_CANDIDATE_SHA" ]; then
            echo 'ERROR: resolved artifact candidate differs from certification request' >&2
            exit 1
          fi

          case "$digest" in
            sha256:*) artifact_sha256="${digest#sha256:}" ;;
            *) echo 'ERROR: artifact has no authoritative sha256 digest' >&2; exit 1 ;;
          esac
          test "${#artifact_sha256}" -eq 64
          expected_name="reversolinguo-tested-dist-$candidate_sha"
          if [ "$artifact_name" != "$expected_name" ]; then
            echo "ERROR: unexpected QA artifact name: $artifact_name" >&2
            exit 1
          fi

          source_run="$(GH_TOKEN="$QA_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id")"
          source_conclusion="$(jq -r '.conclusion // empty' <<<"$source_run")"
          source_head="$(jq -r '.head_sha // empty' <<<"$source_run")"
          source_branch="$(jq -r '.head_branch // empty' <<<"$source_run")"
          source_name="$(jq -r '.name // empty' <<<"$source_run")"
          source_path="$(jq -r '.path // empty' <<<"$source_run")"
          if [ "$source_conclusion" != "success" ] || [ "$source_head" != "$candidate_sha" ]; then
            echo 'ERROR: artifact provenance does not resolve to a successful QA run for the candidate' >&2
            exit 1
          fi
          if [ "$source_name" != 'QA candidate' ] || [ "$source_path" != '.github/workflows/qa.yml' ]; then
            echo 'ERROR: artifact source is not the trusted QA candidate workflow' >&2
            exit 1
          fi
          case "$source_branch" in
            candidate/*) ;;
            *) echo 'ERROR: artifact source branch is not candidate/**' >&2; exit 1 ;;
          esac

          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "resolved candidate: $candidate_sha"
          echo "source QA run: $source_run_id ($source_conclusion)"
          echo "source QA branch: $source_branch"
          echo "artifact digest: sha256:$artifact_sha256"

      - name: Checkout exact certified candidate for provenance
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.artifact.outputs.candidate_sha }}

      - name: Verify candidate and qualified test refs
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.artifact.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "qualified test main: $test_main"
          test "$test_main" = "$CANDIDATE_SHA"
          test -n "$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          if [ -n "${CERTIFY_REF:-}" ]; then
            certify_sha="$(git ls-remote origin "refs/heads/$CERTIFY_REF" | awk '{print $1}')"
            echo "certification ref: $CERTIFY_REF -> $certify_sha"
            test "$certify_sha" = "$CANDIDATE_SHA"
          fi

      - name: Download and verify exact certified artifact
        shell: bash
        env:
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/certified-artifact.zip"
          artifact_dir="$RUNNER_TEMP/certified-artifact"
          GH_TOKEN="$QA_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$artifact_zip"
          actual="$(sha256sum "$artifact_zip" | awk '{print $1}')"
          echo "downloaded artifact sha256: $actual"
          test "$actual" = "$ARTIFACT_SHA256"
          mkdir -p "$artifact_dir"
          unzip -q "$artifact_zip" -d "$artifact_dir"
          cd "$artifact_dir"
          test -d dist
          test -f dist.sha256
          sha256sum --check --strict dist.sha256
          if grep -R -Fq '/Reversolinguo-test/' dist; then
            echo 'ERROR: QA repository path leaked into certified artifact' >&2
            exit 1
          fi

      - name: Compute deterministic certified tree
        id: tree
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/certified-artifact"
          tree_repo="$RUNNER_TEMP/certified-tree"
          mkdir -p "$tree_repo"
          cd "$tree_repo"
          git init -q
          cp -a "$artifact_dir/dist"/. .
          cp "$artifact_dir/dist.sha256" ./dist.sha256
          touch .nojekyll
          git add -A
          expected_tree="$(git write-tree)"
          echo "expected_tree=$expected_tree" >> "$GITHUB_OUTPUT"
          echo "certified tree: $expected_tree"

      - name: Verify gh-pages contains the exact certified tree and hashes
        shell: bash
        env:
          EXPECTED_TREE: ${{ steps.tree.outputs.expected_tree }}
        run: |
          set -euo pipefail
          verify_repo="$RUNNER_TEMP/test-pages-verify"
          git clone --quiet --depth=1 --branch gh-pages "https://github.com/$GITHUB_REPOSITORY.git" "$verify_repo"
          cd "$verify_repo"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          while read -r expected path; do
            rel="${path#dist/}"
            test -f "$rel"
            actual="$(sha256sum "$rel" | awk '{print $1}')"
            test "$actual" = "$expected"
          done < "$RUNNER_TEMP/certified-artifact/dist.sha256"
          test -f .nojekyll

      - name: Authenticate to publication repository
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git

      - name: Prepare exact publication tree
        id: publication
        shell: bash
        env:
          EXPECTED_TREE: ${{ steps.tree.outputs.expected_tree }}
        run: |
          set -euo pipefail
          publication_dir="$RUNNER_TEMP/publication"
          artifact_dir="$RUNNER_TEMP/certified-artifact"
          git clone --quiet "https://github.com/$PUBLICATION_REPO.git" "$publication_dir"
          cd "$publication_dir"
          current_main="$(git rev-parse HEAD)"
          echo "publication main before: $current_main"
          echo "publication_main_before=$current_main" >> "$GITHUB_OUTPUT"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$artifact_dir/dist"/. .
          cp "$artifact_dir/dist.sha256" ./dist.sha256
          touch .nojekyll
          git add -A
          prepared_tree="$(git write-tree)"
          test "$prepared_tree" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create or reuse exact release branch
        id: release
        shell: bash
        env:
          EXPECTED_TREE: ${{ steps.tree.outputs.expected_tree }}
        run: |
          set -euo pipefail
          publication_dir="$RUNNER_TEMP/publication"
          cd "$publication_dir"
          existing_release="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          if [ -n "$existing_release" ]; then
            git fetch --quiet origin "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/certified-release"
            existing_tree="$(git rev-parse refs/remotes/origin/certified-release^{tree})"
            if [ "$existing_tree" != "$EXPECTED_TREE" ]; then
              echo "ERROR: existing release branch has a different tree" >&2
              exit 1
            fi
            publication_commit="$existing_release"
            echo 'release branch already contains the exact certified tree; reusing it'
          else
            git commit -q -m "release: certified $RELEASE_TAG exact artifact $ARTIFACT_ID"
            publication_commit="$(git rev-parse HEAD)"
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi
          remote_release="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          test "$remote_release" = "$publication_commit"
          echo "publication_commit=$publication_commit" >> "$GITHUB_OUTPUT"

      - name: Verify exact release branch remotely
        shell: bash
        env:
          PUBLICATION_COMMIT: ${{ steps.release.outputs.publication_commit }}
          EXPECTED_TREE: ${{ steps.tree.outputs.expected_tree }}
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/publication-verify"
          git clone --quiet --depth=1 --branch "$RELEASE_BRANCH" "https://github.com/$PUBLICATION_REPO.git" "$verify_dir"
          cd "$verify_dir"
          test "$(git rev-parse HEAD)" = "$PUBLICATION_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          while read -r expected path; do
            rel="${path#dist/}"
            test -f "$rel"
            actual="$(sha256sum "$rel" | awk '{print $1}')"
            test "$actual" = "$expected"
          done < dist.sha256
          if grep -R -Fq '/Reversolinguo-test/' . --exclude-dir=.git; then
            echo 'ERROR: publication contains QA repository path' >&2
            exit 1
          fi

      - name: Advance publication main idempotently
        shell: bash
        env:
          PUBLICATION_COMMIT: ${{ steps.release.outputs.publication_commit }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publication"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main" = "$PUBLICATION_COMMIT" ]; then
            echo 'publication main already points to the certified commit; no-op'
          else
            git push origin "$PUBLICATION_COMMIT:refs/heads/main"
          fi
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$PUBLICATION_COMMIT"

      - name: Create or verify immutable tag idempotently
        shell: bash
        env:
          PUBLICATION_COMMIT: ${{ steps.release.outputs.publication_commit }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/publication"
          tag_ref="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          if [ -n "$tag_ref" ]; then
            peeled="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
            if [ -z "$peeled" ]; then peeled="$tag_ref"; fi
            test "$peeled" = "$PUBLICATION_COMMIT"
            echo 'release tag already resolves to the certified commit; no-op'
          else
            git tag -a "$RELEASE_TAG" "$PUBLICATION_COMMIT" -m "Reversolinguo $RELEASE_TAG certified artifact $ARTIFACT_ID"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          tag_ref="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          peeled="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          if [ -z "$peeled" ]; then peeled="$tag_ref"; fi
          test "$peeled" = "$PUBLICATION_COMMIT"

      - name: Final publication verification and summary
        shell: bash
        env:
          TRIGGER_MODE: ${{ steps.request.outputs.trigger_mode }}
          CERTIFY_REF_OUTPUT: ${{ steps.request.outputs.certify_ref }}
          CANDIDATE_SHA: ${{ steps.artifact.outputs.candidate_sha }}
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.source_run_id }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
          PUBLICATION_COMMIT: ${{ steps.release.outputs.publication_commit }}
          EXPECTED_TREE: ${{ steps.tree.outputs.expected_tree }}
        run: |
          set -euo pipefail
          remote_release="$(gh api "repos/$PUBLICATION_REPO/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha')"
          remote_main="$(gh api "repos/$PUBLICATION_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_release" = "$PUBLICATION_COMMIT"
          test "$remote_main" = "$PUBLICATION_COMMIT"
          {
            echo '## Certified publication'
            echo "- trigger_mode: $TRIGGER_MODE"
            if [ -n "$CERTIFY_REF_OUTPUT" ]; then echo "- certify_ref: $CERTIFY_REF_OUTPUT"; fi
            echo "- release: $RELEASE_TAG"
            echo "- artifact_id: $ARTIFACT_ID"
            echo "- source_run_id: $SOURCE_RUN_ID"
            echo "- candidate_sha: $CANDIDATE_SHA"
            echo "- artifact_digest: sha256:$ARTIFACT_SHA256"
            echo "- publication_commit: $PUBLICATION_COMMIT"
            echo "- publication_tree: $EXPECTED_TREE"
            echo '- rebuild: NO'
          } >> "$GITHUB_STEP_SUMMARY"
