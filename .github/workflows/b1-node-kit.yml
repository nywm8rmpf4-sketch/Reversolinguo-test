name: B1 exact pipeline node kit

on:
  push:
    branches:
      - 'assembly/b1-node-kit-r1'

permissions:
  contents: write

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current qualified ADR-042 baseline
        uses: actions/checkout@v4
      - name: Use baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Use baseline npm
        run: npm install --global npm@11.9.0
      - name: Verify exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = 'a22b8ebe265ee44c392967a615c949039a2890ad'
      - name: Install exact dependencies
        run: npm ci
      - name: Rehydrate r1 canonical transport
        shell: bash
        run: |
          set -euo pipefail
          cat catalogs/fr-es/b1/b64/r* > /tmp/b1.bz2.b64
          test "$(wc -c < /tmp/b1.bz2.b64)" = "46748"
          base64 -d /tmp/b1.bz2.b64 > /tmp/b1.csv.bz2
          test "$(sha256sum /tmp/b1.csv.bz2 | awk '{print $1}')" = '8a4bd2210b1da4041528f89cfe9c8756125671abb7cf47dad61c96507a12057a'
          bunzip2 -c /tmp/b1.csv.bz2 > catalogs/fr-es/b1/b1-canonical.csv
          test "$(sha256sum catalogs/fr-es/b1/b1-canonical.csv | awk '{print $1}')" = '9460e9a06bca52cd1998eab5bd2b1d8a5bda7b6ddfcfcfa45f1617a2a09f3b6e'
      - name: Materialize source-controlled cues r2
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { parseCanonicalCsv, serializeCanonicalCsv } from './tools/tabular-catalog-pipeline.mjs'
          const path = 'catalogs/fr-es/b1/b1-canonical.csv'
          const rows = parseCanonicalCsv(readFileSync(path, 'utf8'))
          const cues = JSON.parse(readFileSync('catalogs/fr-es/b1/b1-cues-r2.json', 'utf8'))
          const seen = new Set()
          for (const row of rows) {
            const cue = cues[row.review_id]
            if (!cue) continue
            if (row.alias_of_review_id || row.alias_of_entry_id) throw new Error('CUE_ON_ALIAS:' + row.review_id)
            row.prompt_context_fr_es = cue
            seen.add(row.review_id)
          }
          const missing = Object.keys(cues).filter((id) => !seen.has(id))
          if (missing.length) throw new Error('MISSING_CUE_ROWS:' + missing.join(','))
          writeFileSync(path, serializeCanonicalCsv(rows), 'utf8')
          NODE
          test "$(sha256sum catalogs/fr-es/b1/b1-canonical.csv | awk '{print $1}')" = 'd4e3dbc39b347d23829a7bdba2880daf48626c715580dfde1ee844b8555633ac'
      - name: Run qualified ADR-042 pipeline twice
        shell: bash
        run: |
          set +e
          mkdir -p generated/b1/run1 generated/b1/run2
          node tools/tabular-catalog-pipeline.mjs build             --csv catalogs/fr-es/b1/b1-canonical.csv             --source-manifest catalogs/fr-es/b1/source-manifest.json             --baseline-dir public/catalogs/runtime             --output-dir generated/b1/run1             --exceptions generated/b1/run1-exceptions.json             > generated/b1/run1.log 2>&1
          code1=$?
          echo "$code1" > generated/b1/run1-exit-code.txt
          if [ "$code1" = "0" ]; then
            node tools/tabular-catalog-pipeline.mjs build               --csv catalogs/fr-es/b1/b1-canonical.csv               --source-manifest catalogs/fr-es/b1/source-manifest.json               --baseline-dir public/catalogs/runtime               --output-dir generated/b1/run2               --exceptions generated/b1/run2-exceptions.json               > generated/b1/run2.log 2>&1
            code2=$?
            echo "$code2" > generated/b1/run2-exit-code.txt
            if [ "$code2" = "0" ]; then
              cmp generated/b1/run1/catalog.json generated/b1/run2/catalog.json
              cmp generated/b1/run1/runtime-projection.json generated/b1/run2/runtime-projection.json
              cmp generated/b1/run1/manifest.json generated/b1/run2/manifest.json
              sha256sum generated/b1/run1/catalog.json generated/b1/run1/runtime-projection.json generated/b1/run1/manifest.json > generated/b1/output.sha256
              echo PASS_BYTE_IDENTICAL > generated/b1/determinism.txt
            fi
          fi
          exit 0
      - name: Upload exact diagnostic outputs
        uses: actions/upload-artifact@v4
        with:
          name: b1-adr042-rematerialization-diagnostic-${{ github.sha }}
          path: generated/b1/
          if-no-files-found: error
      - name: Enforce pipeline result
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat generated/b1/run1-exit-code.txt)" = "0"
          test "$(cat generated/b1/run2-exit-code.txt)" = "0"
          test "$(cat generated/b1/determinism.txt)" = "PASS_BYTE_IDENTICAL"

      - name: Materialize immutable B1 data candidate from exact run1 outputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: data-candidate/b1-runtime-r2
        run: |
          set -euo pipefail
          test "$(cat generated/b1/run1-exit-code.txt)" = "0"
          test "$(cat generated/b1/run2-exit-code.txt)" = "0"
          test "$(cat generated/b1/determinism.txt)" = "PASS_BYTE_IDENTICAL"
          test "$(sha256sum generated/b1/run1/catalog.json | awk '{print $1}')" = "bcaa9b78c3fb72571f89f2b997c06282cfaa0384dd994d515c738f25e792ce84"
          test "$(sha256sum generated/b1/run1/runtime-projection.json | awk '{print $1}')" = "9042be51bf6a1eab8963123c103ded926ed8ea65db18b786ea55224eacd418aa"
          test "$(sha256sum generated/b1/run1/manifest.json | awk '{print $1}')" = "57e78b67f6522660e8308004f3a5897ae11f70d115d2c49718f62789bd33a873"

          mkdir -p "$RUNNER_TEMP/b1-runtime"
          cp generated/b1/run1/catalog.json "$RUNNER_TEMP/b1-runtime/catalog.json"
          cp generated/b1/run1/runtime-projection.json "$RUNNER_TEMP/b1-runtime/runtime-projection.json"
          cp generated/b1/run1/manifest.json "$RUNNER_TEMP/b1-runtime/manifest.json"

          git fetch origin main --quiet
          git checkout --detach origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp "$RUNNER_TEMP/b1-runtime/catalog.json" public/catalogs/runtime/catalog.json
          cp "$RUNNER_TEMP/b1-runtime/runtime-projection.json" public/catalogs/runtime/runtime-projection.json
          cp "$RUNNER_TEMP/b1-runtime/manifest.json" public/catalogs/runtime/manifest.json

          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "public/catalogs/runtime/catalog.json"
          test "${changed[1]}" = "public/catalogs/runtime/manifest.json"
          test "${changed[2]}" = "public/catalogs/runtime/runtime-projection.json"

          git add public/catalogs/runtime/catalog.json public/catalogs/runtime/runtime-projection.json public/catalogs/runtime/manifest.json
          git commit -m "data: B1 runtime r2"
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha"
          git ls-remote --exit-code origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1 && {
            echo "ERROR: immutable candidate branch already exists" >&2
            exit 1
          } || true
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
