name: Validate OPT-CERT-2 workflow

on:
  push:
    branches:
      - process/opt-cert-2-r1
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      KNOWN_RUN_ID: '34815485681'
      KNOWN_CANDIDATE_SHA: '5e095ede178b5e6c90e1807dcbb8f49cfd71cd6a'
      KNOWN_ARTIFACT_ID: '10336595262'
    steps:
      - name: Checkout process branch
        uses: actions/checkout@v4

      - name: Validate workflow structure and contract
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/promote-qualified.yml'
          test -f "$file"
          ruby -e "require 'yaml'; YAML.load_file('$file'); puts 'YAML parse PASS'"
          grep -Fq 'workflow_run:' "$file"
          grep -Fq -- '- QA candidate' "$file"
          grep -Fq -- '- completed' "$file"
          grep -Fq 'workflow_dispatch:' "$file"
          grep -Fq "startsWith(github.event.workflow_run.head_branch, 'candidate/')" "$file"
          grep -Fq "source_name\" != 'QA candidate'" "$file"
          grep -Fq "source_path\" != '.github/workflows/qa.yml'" "$file"
          grep -Fq 'expected exactly one non-expired artifact named' "$file"
          grep -Fq 'sha256sum --check --strict dist.sha256' "$file"
          grep -Fq 'git merge-base --is-ancestor' "$file"
          grep -Fq 'reversolinguo-qualified-promotion' "$file"
          grep -Fq 'rebuild: NO' "$file"

      - name: Exercise automatic artifact resolution against a real PASS QA run
        shell: bash
        run: |
          set -euo pipefail
          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KNOWN_RUN_ID")"
          test "$(jq -r '.conclusion' <<<"$source_run")" = 'success'
          test "$(jq -r '.name' <<<"$source_run")" = 'QA candidate'
          test "$(jq -r '.path' <<<"$source_run")" = '.github/workflows/qa.yml'
          candidate_sha="$(jq -r '.head_sha' <<<"$source_run")"
          branch="$(jq -r '.head_branch' <<<"$source_run")"
          test "$candidate_sha" = "$KNOWN_CANDIDATE_SHA"
          case "$branch" in candidate/*) ;; *) exit 1 ;; esac
          expected_name="reversolinguo-tested-dist-$candidate_sha"
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KNOWN_RUN_ID/artifacts?per_page=100")"
          match_count="$(jq --arg expected "$expected_name" '[.artifacts[] | select(.name == $expected and .expired == false)] | length' <<<"$artifacts")"
          test "$match_count" -eq 1
          artifact_id="$(jq -r --arg expected "$expected_name" '.artifacts[] | select(.name == $expected and .expired == false) | .id' <<<"$artifacts")"
          test "$artifact_id" = "$KNOWN_ARTIFACT_ID"
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
          test "$(jq -r '.workflow_run.id' <<<"$metadata")" = "$KNOWN_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$metadata")" = "$KNOWN_CANDIDATE_SHA"
          digest="$(jq -r '.digest' <<<"$metadata")"
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac

      - name: Assert automatic negative guards
        shell: bash
        run: |
          set -euo pipefail
          accepts_branch() {
            case "$1" in candidate/*) return 0 ;; *) return 1 ;; esac
          }
          accepts_conclusion() {
            [ "$1" = 'success' ]
          }
          accepts_branch 'candidate/ui-warm-r2'
          ! accepts_branch 'main'
          ! accepts_branch 'process/opt-cert-2-r1'
          accepts_conclusion 'success'
          ! accepts_conclusion 'failure'
          ! accepts_conclusion 'cancelled'

      - name: Confirm protected product publication is untouched
        shell: bash
        run: |
          set -euo pipefail
          publication="$(gh api repos/nywm8rmpf4-sketch/Reversolinguo/branches/main --jq '.commit.sha')"
          test "$publication" = 'f7e627904d11b8ad6a3d341313ba460e6baaa160'
