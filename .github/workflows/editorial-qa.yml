name: QA editorial staging

on:
  create:
  push:
    branches:
      - 'staging/**'

permissions:
  contents: read

jobs:
  editorial:
    if: ${{ (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'staging/')) || (github.event_name == 'push' && startsWith(github.ref_name, 'staging/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact staging candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'create' && github.event.ref || github.sha }}

      - name: Enforce immutable staging branch contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CREATED_REF: ${{ github.event.ref || '' }}
          CREATED_REF_TYPE: ${{ github.event.ref_type || '' }}
          PUSH_REF: ${{ github.ref_name }}
          PUSH_CREATED: ${{ github.event.created || false }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'create' ]; then
            test "$CREATED_REF_TYPE" = 'branch'
            staging_ref="$CREATED_REF"
          elif [ "$EVENT_NAME" = 'push' ]; then
            staging_ref="$PUSH_REF"
            if [ "$PUSH_CREATED" != 'true' ]; then
              echo 'ERROR: staging/** candidate is immutable; create a new revision instead of updating it.' >&2
              exit 1
            fi
          else
            echo "ERROR: unsupported staging event $EVENT_NAME" >&2
            exit 1
          fi
          case "$staging_ref" in
            staging/*) ;;
            *) echo "ERROR: editorial QA requires staging/**, got $staging_ref" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Classify diff and verify editorial campaign before dependency install
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          node tools/qa-governance.mjs plan \
            --base origin/main \
            --head HEAD \
            --branch "$GITHUB_REF_NAME" \
            --campaign editorial_targeted \
            --plan-file qa-selection.json \
            --github-output "$GITHUB_OUTPUT"
          cat qa-selection.json

      - name: Use baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Use baseline npm
        run: |
          npm install --global npm@11.9.0
          node --version
          npm --version

      - name: Verify unchanged dependency lock
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object package-lock.json)"
          expected="a22b8ebe265ee44c392967a615c949039a2890ad"
          echo "package-lock blob: $actual"
          test "$actual" = "$expected"

      - name: Install exact dependencies
        run: npm ci

      - name: Run lexical staging controls only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t staging_tests < <(find tests/unit -maxdepth 1 -type f -name '*staging.test.ts' | sort)
          test "${#staging_tests[@]}" -gt 0
          npx vitest run \
            tests/unit/catalog-integrity.test.ts \
            tests/unit/taxonomy.test.ts \
            tests/unit/editorial-intake.test.ts \
            tests/unit/lexical-batch.test.ts \
            "${staging_tests[@]}"

      - name: Preserve structured selection proof only
        uses: actions/upload-artifact@v4
        with:
          name: reversolinguo-editorial-qa-proof-${{ github.sha }}
          path: qa-selection.json
          if-no-files-found: error

      - name: Editorial QA selection summary
        shell: bash
        env:
          PROFILE: ${{ steps.impact.outputs.validation_profile }}
          CAMPAIGN: ${{ steps.impact.outputs.campaign }}
          REQUIRED: ${{ steps.impact.outputs.required_controls }}
        run: |
          {
            echo '## Editorial staging QA'
            echo "- validation_profile: $PROFILE"
            echo "- campaign: $CAMPAIGN"
            echo "- required_controls: $REQUIRED"
            echo '- build_runtime: NOT_EXECUTED'
            echo '- playwright_install: NOT_EXECUTED'
            echo '- e2e_offline_accessibility: NOT_EXECUTED'
            echo '- runtime_artifact: NOT_EXECUTED'
          } >> "$GITHUB_STEP_SUMMARY"
