name: Assemble PACK-6B r1

on:
  push:
    branches:
      - 'assembly/v1.1-pack6b-r1'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout assembly
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact reviewed catalog
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import crypto from 'node:crypto'

          const catalogPath = 'catalogs/fr-es/a1/catalog.json'
          const draftPath = 'catalogs/fr-es/a1/drafts/pack6-a1-candidates-r2.json'
          const historical = JSON.parse(fs.readFileSync(catalogPath, 'utf8'))
          const draft = JSON.parse(fs.readFileSync(draftPath, 'utf8'))
          if (historical.length !== 24) throw new Error(`historical-count:${historical.length}`)
          if (draft.length !== 36) throw new Error(`draft-count:${draft.length}`)

          const promoted = draft.map((entry) => ({
            ...entry,
            provenance: {
              ...entry.provenance,
              reviewed_by: 'Project owner bilingual review',
              reviewed_at: '2026-09-14'
            },
            status: 'reviewed'
          }))
          const merged = [...historical, ...promoted]
          const text = `[\n${merged.map((entry) => JSON.stringify(entry)).join(',\n')}\n]\n`
          const hash = crypto.createHash('sha256').update(text).digest('hex')
          const expected = '94b2d5778ae4006ca7a2bf35429247cce4312d8998f99b555b712b50e6c10085'
          console.log(`catalog sha256: ${hash}`)
          if (hash !== expected) throw new Error(`catalog-hash-mismatch:${hash}`)
          fs.writeFileSync(catalogPath, text)
          NODE

          rm catalogs/fr-es/a1/drafts/pack6-a1-candidates-r2.json
          rm src/content/pack6Draft.ts
          rm tests/unit/pack6-lexical-staging.test.ts
          rm .github/workflows/assemble-pack6b-r1.yml

      - name: Commit exact assembly output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'assembly: materialize exact PACK-6B catalog'
          git push origin HEAD:assembly/v1.1-pack6b-r1
