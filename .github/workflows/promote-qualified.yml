name: Promote qualified candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit already qualified by QA
        required: true
        type: string
      artifact_id:
        description: Exact GitHub Actions artifact ID from the PASS QA run
        required: true
        type: string
      artifact_sha256:
        description: Expected SHA-256 of the downloaded artifact ZIP
        required: true
        type: string
      expected_main_head:
        description: Current Reversolinguo-test/main HEAD expected before promotion
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
      EXPECTED_MAIN_HEAD: ${{ inputs.expected_main_head }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}

      - name: Guard candidate and current main identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main --quiet
          current_main="$(git rev-parse origin/main)"
          echo "current main: $current_main"
          test "$current_main" = "$EXPECTED_MAIN_HEAD"
          git merge-base --is-ancestor "$current_main" "$CANDIDATE_SHA"

      - name: Download exact qualified artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/qualified-artifact.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$artifact_zip"
          actual="$(sha256sum "$artifact_zip" | awk '{print $1}')"
          echo "artifact sha256: $actual"
          test "$actual" = "$ARTIFACT_SHA256"
          mkdir -p "$RUNNER_TEMP/qualified-artifact"
          unzip -q "$artifact_zip" -d "$RUNNER_TEMP/qualified-artifact"
          cd "$RUNNER_TEMP/qualified-artifact"
          test -d dist
          test -f dist.sha256
          sha256sum --check --strict dist.sha256
          if grep -R -Fq '/Reversolinguo-test/' dist; then
            echo 'ERROR: non-portable repository path found in qualified artifact' >&2
            exit 1
          fi

      - name: Promote exact source commit to test main
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$CANDIDATE_SHA:refs/heads/main"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "promoted main: $remote_main"
          test "$remote_main" = "$CANDIDATE_SHA"

      - name: Publish exact qualified dist to gh-pages without rebuild
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/qualified-artifact"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan qa-exact-pages
          git rm -rf .
          git clean -fdx
          cp -a "$publish_dir/dist"/. .
          cp "$publish_dir/dist.sha256" ./dist.sha256
          touch .nojekyll
          git add -A
          git commit -m "pages: exact qualified artifact $CANDIDATE_SHA"
          pages_commit="$(git rev-parse HEAD)"
          git push --force origin HEAD:gh-pages
          remote_pages="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          echo "gh-pages: $remote_pages"
          test "$remote_pages" = "$pages_commit"

      - name: Reverify published page blobs against recorded hashes
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            rel="${path#dist/}"
            actual="$(git show "HEAD:$rel" | sha256sum | awk '{print $1}')"
            test "$actual" = "$expected"
          done < "$RUNNER_TEMP/qualified-artifact/dist.sha256"
