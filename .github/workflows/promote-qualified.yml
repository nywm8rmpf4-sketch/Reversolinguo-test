name: Promote qualified candidate

on:
  workflow_run:
    workflows:
      - QA candidate
      - QA data candidate
    types:
      - completed
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Exact GitHub Actions artifact ID from the PASS QA run
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: reversolinguo-qualified-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (startsWith(github.event.workflow_run.head_branch, 'candidate/') || startsWith(github.event.workflow_run.head_branch, 'data-candidate/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve exact qualified artifact
        id: artifact
        shell: bash
        env:
          MANUAL_ARTIFACT_ID: ${{ inputs.artifact_id || '' }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            source_run_id="$(jq -r '.workflow_run.id // empty' "$GITHUB_EVENT_PATH")"
            candidate_sha="$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")"
            source_conclusion="$(jq -r '.workflow_run.conclusion // empty' "$GITHUB_EVENT_PATH")"
            source_branch="$(jq -r '.workflow_run.head_branch // empty' "$GITHUB_EVENT_PATH")"

            test "$source_conclusion" = 'success'
            test -n "$source_run_id"
            test -n "$candidate_sha"
            case "$source_branch" in
              candidate/*|data-candidate/*) ;;
              *) echo "ERROR: automatic promotion is restricted to candidate/** or data-candidate/** branches" >&2; exit 1 ;;
            esac

            expected_name="reversolinguo-tested-dist-$candidate_sha"
            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100")"
            match_count="$(jq --arg expected "$expected_name" '[.artifacts[] | select(.name == $expected and .expired == false)] | length' <<<"$artifacts")"
            if [ "$match_count" -ne 1 ]; then
              echo "ERROR: expected exactly one non-expired artifact named $expected_name in QA run $source_run_id; found $match_count" >&2
              exit 1
            fi
            artifact_id="$(jq -r --arg expected "$expected_name" '.artifacts[] | select(.name == $expected and .expired == false) | .id' <<<"$artifacts")"
            trigger_mode='automatic-workflow-run'
          elif [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            artifact_id="$MANUAL_ARTIFACT_ID"
            test -n "$artifact_id"
            trigger_mode='manual-dispatch'
            source_run_id=''
            candidate_sha=''
          else
            echo "ERROR: unsupported trigger $GITHUB_EVENT_NAME" >&2
            exit 1
          fi

          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id")"
          expired="$(jq -r '.expired' <<<"$metadata")"
          metadata_candidate_sha="$(jq -r '.workflow_run.head_sha // empty' <<<"$metadata")"
          metadata_source_run_id="$(jq -r '.workflow_run.id // empty' <<<"$metadata")"
          digest="$(jq -r '.digest // empty' <<<"$metadata")"
          artifact_name="$(jq -r '.name // empty' <<<"$metadata")"

          test "$expired" = 'false'
          test -n "$metadata_candidate_sha"
          test -n "$metadata_source_run_id"
          test -n "$artifact_name"

          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            test "$metadata_candidate_sha" = "$candidate_sha"
            test "$metadata_source_run_id" = "$source_run_id"
          else
            candidate_sha="$metadata_candidate_sha"
            source_run_id="$metadata_source_run_id"
          fi

          case "$digest" in
            sha256:*) artifact_sha256="${digest#sha256:}" ;;
            *) echo "ERROR: artifact has no authoritative sha256 digest" >&2; exit 1 ;;
          esac
          test "${#artifact_sha256}" -eq 64

          expected_name="reversolinguo-tested-dist-$candidate_sha"
          if [ "$artifact_name" != "$expected_name" ]; then
            echo "ERROR: unexpected QA artifact name: $artifact_name" >&2
            exit 1
          fi

          source_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id")"
          source_conclusion="$(jq -r '.conclusion // empty' <<<"$source_run")"
          source_head="$(jq -r '.head_sha // empty' <<<"$source_run")"
          source_branch="$(jq -r '.head_branch // empty' <<<"$source_run")"
          source_name="$(jq -r '.name // empty' <<<"$source_run")"
          source_path="$(jq -r '.path // empty' <<<"$source_run")"

          if [ "$source_conclusion" != 'success' ] || [ "$source_head" != "$candidate_sha" ]; then
            echo "ERROR: artifact provenance does not resolve to a successful QA run for the candidate" >&2
            exit 1
          fi

          case "$source_branch" in
            candidate/*)
              expected_source_name='QA candidate'
              expected_source_path='.github/workflows/qa.yml'
              ;;
            data-candidate/*)
              expected_source_name='QA data candidate'
              expected_source_path='.github/workflows/data-qa.yml'
              ;;
            *)
              echo "ERROR: artifact source branch is not a trusted candidate family" >&2
              exit 1
              ;;
          esac
          if [ "$source_name" != "$expected_source_name" ] || [ "$source_path" != "$expected_source_path" ]; then
            echo "ERROR: artifact source is not the trusted workflow for $source_branch" >&2
            exit 1
          fi

          echo "ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=$trigger_mode" >> "$GITHUB_OUTPUT"
          echo "promotion trigger: $trigger_mode"
          echo "resolved candidate: $candidate_sha"
          echo "source QA run: $source_run_id ($source_conclusion)"
          echo "artifact id: $artifact_id"
          echo "artifact digest: sha256:$artifact_sha256"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.artifact.outputs.candidate_sha }}

      - name: Verify candidate and current test main
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.artifact.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main --quiet
          current_main="$(git rev-parse origin/main)"
          echo "test main before: $current_main"
          if [ "$current_main" != "$CANDIDATE_SHA" ]; then
            git merge-base --is-ancestor "$current_main" "$CANDIDATE_SHA"
          fi

      - name: Download and verify exact qualified artifact
        shell: bash
        env:
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          artifact_zip="$RUNNER_TEMP/qualified-artifact.zip"
          artifact_dir="$RUNNER_TEMP/qualified-artifact"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$artifact_zip"
          actual="$(sha256sum "$artifact_zip" | awk '{print $1}')"
          echo "downloaded artifact sha256: $actual"
          test "$actual" = "$ARTIFACT_SHA256"
          mkdir -p "$artifact_dir"
          unzip -q "$artifact_zip" -d "$artifact_dir"
          cd "$artifact_dir"
          test -d dist
          test -f dist.sha256
          sha256sum --check --strict dist.sha256
          if grep -R -Fq '/Reversolinguo-test/' dist; then
            echo 'ERROR: non-portable repository path found in qualified artifact' >&2
            exit 1
          fi

      - name: Promote exact source commit to test main if needed
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.artifact.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main" != "$CANDIDATE_SHA" ]; then
            git push origin "$CANDIDATE_SHA:refs/heads/main"
          else
            echo 'test main already points to the qualified candidate; no-op'
          fi
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "test main after: $remote_main"
          test "$remote_main" = "$CANDIDATE_SHA"

      - name: Materialize deterministic Pages tree
        id: pages_tree
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.artifact.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/qualified-artifact"
          pages_repo="$RUNNER_TEMP/pages-replay"
          mkdir -p "$pages_repo"
          cd "$pages_repo"
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -a "$artifact_dir/dist"/. .
          cp "$artifact_dir/dist.sha256" ./dist.sha256
          touch .nojekyll
          git add -A
          expected_tree="$(git write-tree)"
          echo "expected_tree=$expected_tree" >> "$GITHUB_OUTPUT"
          echo "deterministic Pages tree: $expected_tree"
          gh auth setup-git
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"

      - name: Publish exact qualified dist to gh-pages only if tree changed
        id: pages
        shell: bash
        env:
          EXPECTED_TREE: ${{ steps.pages_tree.outputs.expected_tree }}
          CANDIDATE_SHA: ${{ steps.artifact.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          pages_repo="$RUNNER_TEMP/pages-replay"
          cd "$pages_repo"
          remote_pages="$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')"
          if [ -n "$remote_pages" ]; then
            git fetch --quiet origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            remote_tree="$(git rev-parse refs/remotes/origin/gh-pages^{tree})"
          else
            remote_tree=''
          fi
          if [ "$remote_tree" = "$EXPECTED_TREE" ]; then
            pages_commit="$remote_pages"
            echo 'gh-pages already contains the exact qualified tree; no-op'
          else
            git commit -q -m "pages: exact qualified artifact $CANDIDATE_SHA"
            pages_commit="$(git rev-parse HEAD)"
            git push --force origin HEAD:refs/heads/gh-pages
          fi
          echo "pages_commit=$pages_commit" >> "$GITHUB_OUTPUT"

      - name: Reverify remote gh-pages tree and hashes
        shell: bash
        env:
          EXPECTED_TREE: ${{ steps.pages_tree.outputs.expected_tree }}
        run: |
          set -euo pipefail
          pages_repo="$RUNNER_TEMP/pages-replay"
          artifact_dir="$RUNNER_TEMP/qualified-artifact"
          cd "$pages_repo"
          git fetch --force --quiet origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          remote_pages="$(git rev-parse refs/remotes/origin/gh-pages)"
          remote_tree="$(git rev-parse refs/remotes/origin/gh-pages^{tree})"
          echo "gh-pages commit: $remote_pages"
          echo "gh-pages tree: $remote_tree"
          test "$remote_tree" = "$EXPECTED_TREE"
          while read -r expected path; do
            rel="${path#dist/}"
            actual="$(git show "refs/remotes/origin/gh-pages:$rel" | sha256sum | awk '{print $1}')"
            test "$actual" = "$expected"
          done < "$artifact_dir/dist.sha256"
          git cat-file -e refs/remotes/origin/gh-pages:.nojekyll

      - name: Promotion summary
        shell: bash
        env:
          TRIGGER_MODE: ${{ steps.artifact.outputs.trigger_mode }}
          CANDIDATE_SHA: ${{ steps.artifact.outputs.candidate_sha }}
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.source_run_id }}
          ARTIFACT_SHA256: ${{ steps.artifact.outputs.artifact_sha256 }}
          EXPECTED_TREE: ${{ steps.pages_tree.outputs.expected_tree }}
          PAGES_COMMIT: ${{ steps.pages.outputs.pages_commit }}
        run: |
          {
            echo '## Exact qualified promotion'
            echo "- trigger_mode: $TRIGGER_MODE"
            echo "- artifact_id: $ARTIFACT_ID"
            echo "- source_run_id: $SOURCE_RUN_ID"
            echo "- candidate_sha: $CANDIDATE_SHA"
            echo "- artifact_digest: sha256:$ARTIFACT_SHA256"
            echo "- pages_commit: $PAGES_COMMIT"
            echo "- pages_tree: $EXPECTED_TREE"
            echo '- rebuild: NO'
          } >> "$GITHUB_STEP_SUMMARY"
