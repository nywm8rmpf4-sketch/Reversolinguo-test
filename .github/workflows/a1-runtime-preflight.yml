name: A1 runtime assembly preflight

# Fresh preflight after ADR-032: automated accessibility audit removed from blocking gate.
on:
  push:
    branches:
      - 'assembly/a1-canonical-runtime-r1'
    paths:
      - '.github/workflows/a1-runtime-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact assembly
        uses: actions/checkout@v4
      - name: Use baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Use baseline npm
        run: npm install --global npm@11.9.0
      - name: Verify exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = 'a22b8ebe265ee44c392967a615c949039a2890ad'
      - name: Install exact dependencies
        run: npm ci
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Static unit integration and build preflight
        run: npm run check
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser and offline preflight
        run: npm run test:e2e
