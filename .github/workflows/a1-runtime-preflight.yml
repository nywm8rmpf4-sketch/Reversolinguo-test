name: A1 runtime assembly preflight

# Fresh rerun after demonstrated stale-test corrections for A1 canonical promotion.
# Includes an isolated WebKit-mobile accessibility-path reproduction after candidate r2 timed out.
on:
  push:
    branches:
      - 'assembly/a1-canonical-runtime-r1'
    paths:
      - '.github/workflows/a1-runtime-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact assembly
        uses: actions/checkout@v4
      - name: Use baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Use baseline npm
        run: npm install --global npm@11.9.0
      - name: Verify exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = 'a22b8ebe265ee44c392967a615c949039a2890ad'
      - name: Install exact dependencies
        run: npm ci
      - name: Static unit integration and build preflight
        run: npm run check
      - name: Install WebKit mobile engine
        run: npx playwright install --with-deps webkit
      - name: Install pinned accessibility audit tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts @axe-core/playwright@4.13.0 axe-core@4.13.0
          test "$(node -p "require('./node_modules/@axe-core/playwright/package.json').version")" = "4.13.0"
          test "$(node -p "require('./node_modules/axe-core/package.json').version")" = "4.13.0"
          test "$(git hash-object package-lock.json)" = "a22b8ebe265ee44c392967a615c949039a2890ad"
      - name: Reproduce accessibility path on WebKit mobile three times
        run: npx playwright test tests/e2e/accessibility.spec.mjs --project=webkit-mobile --repeat-each=3
