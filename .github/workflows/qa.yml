name: QA candidate

on:
  push:
    branches:
      - 'candidate/**'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Use baseline npm
        run: |
          npm install --global npm@11.9.0
          node --version
          npm --version

      - name: Verify exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object package-lock.json)"
          expected="a22b8ebe265ee44c392967a615c949039a2890ad"
          echo "package-lock blob: $actual"
          test "$actual" = "$expected"

      - name: Install exact dependencies
        run: npm ci

      - name: Static, unit, integration and single build
        run: npm run check

      - name: Record built artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256
          cat dist.sha256

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser and offline QA on the same build
        run: npm run test:e2e

      - name: Upload exact tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: reversolinguo-tested-dist-${{ github.sha }}
          path: |
            dist/
            dist.sha256
          if-no-files-found: error
