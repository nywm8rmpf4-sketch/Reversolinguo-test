name: QA candidate

on:
  push:
    branches:
      - 'candidate/**'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REVERSOLINGUO_BASE: /Reversolinguo-test/
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Use baseline npm
        run: |
          npm install --global npm@11.9.0
          node --version
          npm --version

      - name: Verify exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object package-lock.json)"
          expected="a22b8ebe265ee44c392967a615c949039a2890ad"
          echo "package-lock blob: $actual"
          test "$actual" = "$expected"

      - name: Install exact dependencies
        run: npm ci

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Static, unit, integration and single build
        run: npm run check

      - name: Shell size, CSP and Pages base gates
        shell: bash
        run: |
          set -euo pipefail
          dist_bytes="$(find dist -type f -printf '%s\n' | awk '{sum += $1} END {print sum+0}')"
          echo "dist uncompressed bytes: $dist_bytes"
          test "$dist_bytes" -le 3145728
          grep -Fq "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" dist/index.html
          grep -Fq 'src="/Reversolinguo-test/assets/' dist/index.html
          grep -Fq 'href="/Reversolinguo-test/manifest.webmanifest"' dist/index.html
          grep -Fq '"scope":"/Reversolinguo-test/"' dist/manifest.webmanifest

      - name: Record built artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256
          cat dist.sha256

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install pinned accessibility audit tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts @axe-core/playwright@4.13.0 axe-core@4.13.0
          test "$(node -p "require('./node_modules/@axe-core/playwright/package.json').version")" = "4.13.0"
          test "$(node -p "require('./node_modules/axe-core/package.json').version")" = "4.13.0"
          test "$(git hash-object package-lock.json)" = "a22b8ebe265ee44c392967a615c949039a2890ad"
          axe_path="$(node -p "require.resolve('axe-core/axe.min.js')")"
          echo "c24f097bd2f451d4f933e8bc7d8d539f8672a2ebcb5cc9f9f3eec8ca9470a0c1  $axe_path" | sha256sum --check --strict
          echo "AXE_CORE_PATH=$axe_path" >> "$GITHUB_ENV"

      - name: Browser, offline and automated accessibility QA on the same build
        run: npm run test:e2e

      - name: Upload exact tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: reversolinguo-tested-dist-${{ github.sha }}
          path: |
            dist/
            dist.sha256
          if-no-files-found: error

      - name: Publish exact tested dist to gh-pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/reversolinguo-pages"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp -a dist/. "$publish_dir/"
          cp dist.sha256 "$publish_dir/dist.sha256"
          touch "$publish_dir/.nojekyll"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan gh-pages
          git rm -rf .
          git clean -fdx
          cp -a "$publish_dir"/. .
          git add -A
          git commit -m "pages: exact tested artifact $GITHUB_SHA"
          git push --force origin HEAD:gh-pages
