name: QA candidate

on:
  push:
    branches:
      - 'candidate/**'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize and verify exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          actual="$(git hash-object package-lock.json)"
          expected="a22b8ebe265ee44c392967a615c949039a2890ad"
          echo "package-lock blob: $actual"
          test "$actual" = "$expected"
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(qa): materialize exact lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install exact dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Static, unit, integration and single build
        run: npm run check

      - name: Record built artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256
          cat dist.sha256

      - name: Browser and offline QA on the same build
        run: npm run test:e2e

      - name: Upload exact tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: reversolinguo-tested-dist-${{ github.sha }}
          path: |
            dist/
            dist.sha256
          if-no-files-found: error
