# Portable-release candidate QA: classify first, build once, validate once, promote exact artifact.
name: QA candidate

on:
  push:
    branches:
      - 'candidate/**'

permissions:
  contents: read

jobs:
  qa:
    if: ${{ startsWith(github.ref_name, 'candidate/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce immutable candidate branch contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref_name }}
          PUSH_CREATED: ${{ github.event.created || false }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != 'push' ]; then
            echo "ERROR: unsupported candidate event $EVENT_NAME" >&2
            exit 1
          fi
          candidate_ref="$PUSH_REF"
          case "$candidate_ref" in
            candidate/*) ;;
            *) echo "ERROR: QA candidate requires candidate/**, got $candidate_ref" >&2; exit 1 ;;
          esac
          if [ "$PUSH_CREATED" != 'true' ]; then
            echo 'ERROR: candidate/** is immutable; create a new candidate revision instead of updating it.' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Classify diff and verify runtime campaign before costly QA
        id: impact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          node tools/qa-governance.mjs plan \
            --base origin/main \
            --head HEAD \
            --branch "$GITHUB_REF_NAME" \
            --campaign runtime_full \
            --plan-file qa-selection.json \
            --github-output "$GITHUB_OUTPUT"
          cat qa-selection.json

      - name: Use baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Use baseline npm
        run: |
          npm install --global npm@11.9.0
          node --version
          npm --version

      - name: Verify exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git hash-object package-lock.json)"
          expected="a22b8ebe265ee44c392967a615c949039a2890ad"
          echo "package-lock blob: $actual"
          test "$actual" = "$expected"

      - name: Install exact dependencies
        run: npm ci

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Static, unit, integration and single build
        run: npm run check

      - name: Portable artifact, size and CSP gates
        shell: bash
        run: |
          set -euo pipefail
          dist_bytes="$(find dist -type f -printf '%s\n' | awk '{sum += $1} END {print sum+0}')"
          echo "dist uncompressed bytes: $dist_bytes"
          test "$dist_bytes" -le 3145728
          grep -Fq "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" dist/index.html
          grep -Eq 'src="\./assets/' dist/index.html
          grep -Fq 'href="./manifest.webmanifest"' dist/index.html
          if grep -R -Fq '/Reversolinguo-test/' dist; then
            echo 'ERROR: QA repository path leaked into portable artifact' >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const manifest = JSON.parse(fs.readFileSync('dist/manifest.webmanifest', 'utf8'))
          if (manifest.start_url !== './') throw new Error(`non-portable start_url: ${manifest.start_url}`)
          if (manifest.scope !== undefined && manifest.scope !== './') throw new Error(`non-portable scope: ${manifest.scope}`)
          for (const icon of manifest.icons ?? []) {
            if (typeof icon.src === 'string' && icon.src.startsWith('/')) throw new Error(`absolute icon path: ${icon.src}`)
          }
          NODE

      - name: Record built artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256
          cat dist.sha256

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install pinned accessibility audit tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts @axe-core/playwright@4.13.0 axe-core@4.13.0
          test "$(node -p "require('./node_modules/@axe-core/playwright/package.json').version")" = "4.13.0"
          test "$(node -p "require('./node_modules/axe-core/package.json').version")" = "4.13.0"
          test "$(git hash-object package-lock.json)" = "a22b8ebe265ee44c392967a615c949039a2890ad"
          axe_path="$(node -p "require.resolve('axe-core/axe.min.js')")"
          echo "c24f097bd2f451d4f933e8bc7d8d539f8672a2ebcb5cc9f9f3eec8ca9470a0c1  $axe_path" | sha256sum --check --strict
          echo "AXE_CORE_PATH=$axe_path" >> "$GITHUB_ENV"

      - name: Browser, offline and automated accessibility QA on portable build under QA subpath
        run: npm run test:e2e

      - name: Upload exact tested artifact and selection proof
        uses: actions/upload-artifact@v4
        with:
          name: reversolinguo-tested-dist-${{ github.sha }}
          path: |
            dist/
            dist.sha256
            qa-selection.json
          if-no-files-found: error

      - name: QA selection summary
        shell: bash
        env:
          PROFILE: ${{ steps.impact.outputs.validation_profile }}
          CAMPAIGN: ${{ steps.impact.outputs.campaign }}
          REQUIRED: ${{ steps.impact.outputs.required_controls }}
        run: |
          {
            echo '## Executable QA selection'
            echo "- validation_profile: $PROFILE"
            echo "- campaign: $CAMPAIGN"
            echo "- required_controls: $REQUIRED"
            echo '- runtime_artifact: YES'
          } >> "$GITHUB_STEP_SUMMARY"
