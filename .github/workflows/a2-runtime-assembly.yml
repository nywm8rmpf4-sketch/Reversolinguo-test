name: A2 runtime assembly
# rerun: fixture-scalability-r2

on:
  push:
    branches:
      - assembly/a2-runtime-r1
    paths:
      - .github/workflows/a2-runtime-assembly.yml

permissions:
  contents: write

jobs:
  generate-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assembly/a2-runtime-r1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Generate exact A2 runtime bundle
        run: node tools/promote-a2-level.mjs
      - name: Targeted freshness tests
        run: >
          npx vitest run
          tests/unit/a2-editorial-staging.test.ts
          tests/unit/catalog-cumulative-contract.test.ts
          tests/unit/lexical-batch.test.ts
          tests/unit/language-pairs.test.ts
          tests/unit/catalog-integrity.test.ts
          tests/unit/pack6-canonical-promotion.test.ts
          tests/unit/path-selection-pack7.test.ts
          tests/integration/app.test.tsx
      - name: Build exact candidate
        run: npm run build
      - name: Commit generated runtime bytes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             catalogs/fr-es/a2/catalog.json             catalogs/fr-es/a2/runtime-projection.json             catalogs/fr-es/a2/manifest.json             catalogs/fr-es/a2/projection-source.json             evidence/active/A2_RUNTIME_GENERATION_REPORT.json
          git diff --cached --exit-code && { echo "No generated changes"; exit 0; }
          git commit -m "build: materialize exact A2 runtime bundle"
          git push origin HEAD:assembly/a2-runtime-r1
