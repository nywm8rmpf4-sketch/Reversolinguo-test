name: R4 impact QA

on:
  push:
    branches:
      - impact/r4-unknown-exploration

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REVERSOLINGUO_BASE: /Reversolinguo-test/
    steps:
      - name: Checkout exact R4 candidate
        uses: actions/checkout@v4

      - name: Use baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Use baseline npm
        run: npm install --global npm@11.9.0

      - name: Verify exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = "a22b8ebe265ee44c392967a615c949039a2890ad"

      - name: Install exact dependencies
        run: npm ci

      - name: Lint R4 impact surface
        run: npx eslint src/app/App.tsx src/domain/exploration.ts src/i18n/messages.ts tests/unit/exploration.test.ts tests/integration/app.test.tsx tests/integration/r4-flow.test.tsx --max-warnings 0

      - name: Typecheck
        run: npm run typecheck

      - name: Test App and R4 impact surface
        run: npx vitest run tests/unit/exploration.test.ts tests/integration/app.test.tsx tests/integration/r4-flow.test.tsx

      - name: Build exact Pages candidate
        run: npm run build

      - name: Pages size, CSP and base gates
        shell: bash
        run: |
          set -euo pipefail
          dist_bytes="$(find dist -type f -printf '%s\n' | awk '{sum += $1} END {print sum+0}')"
          echo "dist uncompressed bytes: $dist_bytes"
          test "$dist_bytes" -le 3145728
          grep -Fq "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" dist/index.html
          grep -Fq 'src="/Reversolinguo-test/assets/' dist/index.html
          grep -Fq 'href="/Reversolinguo-test/manifest.webmanifest"' dist/index.html
          grep -Fq '"scope":"/Reversolinguo-test/"' dist/manifest.webmanifest
