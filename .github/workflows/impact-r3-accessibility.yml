name: QA impact R3 accessibility

on:
  push:
    branches:
      - impact/r3-accessibility-recovery
  workflow_dispatch:

permissions:
  contents: write

jobs:
  impact-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVERSOLINGUO_BASE: /Reversolinguo-test/
    steps:
      - name: Checkout exact recovery candidate
        uses: actions/checkout@v4

      - name: Use baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Use baseline npm
        run: npm install --global npm@11.9.0

      - name: Verify unchanged dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package-lock.json)" = "a22b8ebe265ee44c392967a615c949039a2890ad"

      - name: Install exact dependencies
        run: npm ci

      - name: Rebuild and prove runtime artifact identical to run 31
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist.sha256
          cat > expected.sha256 <<'EOF'
          5617f31db1b81c6f87e6ed6066209092a8530377f4ba3185ac5d73a0375f1316  dist/assets/contracts-CxGFnrfT.js
          0a38c88a9f90e5b3c8c37fb3e4245fce06b6fff974b18573efc684725b03a21c  dist/assets/index-Db5vJFVT.js
          b255588ccc0eaee23c3f67cd1f1f324d850885e4b7401bd903453aea1beb06ac  dist/assets/index-kznh8eBI.css
          17bcc17d60dc78f927834b880c39649b03af46fd1f5cdbb8c42c5ae2b515dce9  dist/assets/workbox-window.prod.es5-Bd17z0YL.js
          bf1dde527fc1441d0dbacb1bf21827aef5c22e83749b90493ad50b767cce0b39  dist/icon.svg
          f33e0e4d6fc2020d1d4aac4091c2805cb512f97b16c6408f8e98436049a27d32  dist/index.html
          ed583420f4a9644a6a6337e77e3c5ad2c67618c120fd7c2e0847b97adcf85fa7  dist/manifest.webmanifest
          be7d78aac16183d36ca624b2fa437723c7e46e696d727a8c156b8e27a0473d0f  dist/sw.js
          EOF
          diff -u expected.sha256 dist.sha256

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install pinned accessibility tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts @axe-core/playwright@4.13.0 axe-core@4.13.0
          test "$(node -p "require('./node_modules/@axe-core/playwright/package.json').version")" = "4.13.0"
          test "$(node -p "require('./node_modules/axe-core/package.json').version")" = "4.13.0"
          test "$(git hash-object package-lock.json)" = "a22b8ebe265ee44c392967a615c949039a2890ad"
          axe_path="$(node -p "require.resolve('axe-core/axe.min.js')")"
          echo "c24f097bd2f451d4f933e8bc7d8d539f8672a2ebcb5cc9f9f3eec8ca9470a0c1  $axe_path" | sha256sum --check --strict
          echo "AXE_CORE_PATH=$axe_path" >> "$GITHUB_ENV"

      - name: Run only impacted accessibility scenario on three engines
        run: npx playwright test tests/e2e/accessibility.spec.mjs

      - name: Upload exact tested R3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: reversolinguo-r3-impact-tested-dist-${{ github.sha }}
          path: |
            dist/
            dist.sha256
          if-no-files-found: error

      - name: Publish exact tested R3 dist to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/reversolinguo-pages"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp -a dist/. "$publish_dir/"
          cp dist.sha256 "$publish_dir/dist.sha256"
          touch "$publish_dir/.nojekyll"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan gh-pages
          git rm -rf .
          git clean -fdx
          cp -a "$publish_dir"/. .
          git add -A
          git commit -m "pages: exact R3 runtime b9241364a664b2f26fd54c4a1a26ec3533ec2a46"
          git push --force origin HEAD:gh-pages
